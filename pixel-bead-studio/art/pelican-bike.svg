<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <!-- ================= 自行车 ================= -->
  <g>
    <circle cx="22" cy="35" r="10" fill="#1A1A1A"/>
    <circle cx="22" cy="35" r="8" fill="#F2F2F2"/>
    <circle cx="22" cy="35" r="1.8" fill="#9B9B9B"/>
    <circle cx="72" cy="35" r="10" fill="#1A1A1A"/>
    <circle cx="72" cy="35" r="8" fill="#F2F2F2"/>
    <circle cx="72" cy="35" r="1.8" fill="#9B9B9B"/>
    <line x1="22" y1="35" x2="47" y2="35" stroke="#8B5A2B" stroke-width="1.2"/>
    <line x1="47" y1="35" x2="36" y2="27" stroke="#8B5A2B" stroke-width="1.2"/>
    <line x1="22" y1="35" x2="36" y2="27" stroke="#8B5A2B" stroke-width="1.2"/>
    <line x1="47" y1="35" x2="62" y2="25" stroke="#8B5A2B" stroke-width="1.2"/>
    <line x1="36" y1="27" x2="60" y2="25" stroke="#8B5A2B" stroke-width="1.2"/>
    <line x1="62" y1="25" x2="72" y2="35" stroke="#8B5A2B" stroke-width="1.2"/>
    <line x1="62" y1="25" x2="63" y2="19" stroke="#8B5A2B" stroke-width="1.2"/>
    <line x1="59" y1="19" x2="68" y2="19" stroke="#8B5A2B" stroke-width="1.2"/>
    <circle cx="47" cy="35" r="4" fill="#F2F2F2"/>
    <circle cx="47" cy="35" r="4" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="47" y1="35" x2="50" y2="41" stroke="#1A1A1A" stroke-width="1.2"/>
    <line x1="45" y1="41" x2="53" y2="41" stroke="#1A1A1A" stroke-width="1.2"/>
    <path d="M31 26 L40 26 L39 28 L31 28 Z" fill="#8B5A2B"/>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g>
    <!-- 腿 -->
    <line x1="42" y1="28" x2="47" y2="37" stroke="#FFA300" stroke-width="1.8"/>
    <line x1="47" y1="37" x2="50" y2="41" stroke="#FFA300" stroke-width="1.8"/>
    <!-- 尾羽 -->
    <path d="M18 15 L28 19 L26 25 L18 23 Z" fill="#E8A03C"/>
    <!-- 脖子：用实心多边形连住头和身体（之前只有描边，头是"飘"着的） -->
    <path d="M43 24 L46 15 L51 16 L51 24 Z" fill="#FFF3C4"/>
    <!-- 身体 -->
    <ellipse cx="36" cy="22" rx="11" ry="6.5" fill="#FFF3C4"/>
    <ellipse cx="36" cy="22" rx="11" ry="6.5" fill="none" stroke="#3E2A20" stroke-width="1"/>
    <!-- 翅膀 -->
    <path d="M31 19 C 35 16, 43 17, 45 20 C 42 25, 33 25, 31 19 Z" fill="#E8A03C"/><path d="M31 19 C 35 16, 43 17, 45 20 C 42 25, 33 25, 31 19 Z" fill="none" stroke="#3E2A20" stroke-width="1"/>
    <!-- 头（压在脖子上面） -->
    <circle cx="54" cy="12" r="5.5" fill="#FFF3C4"/>
    <circle cx="54" cy="12" r="5.5" fill="none" stroke="#3E2A20" stroke-width="1"/>
    <!-- 上喙 -->
    <path d="M58 9 L79 11 L58 14 Z" fill="#FFA300"/>
    <path d="M58 9 L79 11 L58 14 Z" fill="none" stroke="#3E2A20" stroke-width="1"/>
    <!-- 喉囊 -->
    <path d="M58 14 C 61 20, 73 20, 78 12 Z" fill="#FFD400"/>
    <path d="M58 14 C 61 20, 73 20, 78 12 Z" fill="none" stroke="#3E2A20" stroke-width="1"/>
    <!-- 眼睛 -->
    <circle cx="56" cy="11" r="1.6" fill="#1A1A1A"/>
    <circle cx="56.6" cy="10.4" r="0.55" fill="#FFFFFF"/>
    <!-- 一小撮冠羽 -->
    <path d="M51 7 L52 4 L54 6 L55 3 L57 6 L58 4 L59 7 Z" fill="#E8A03C"/>
    <!-- 翅尖伸向车把 -->
    <line x1="45" y1="20" x2="56" y2="19" stroke="#3E2A20" stroke-width="1"/>
  </g>

  <line x1="6" y1="46" x2="90" y2="46" stroke="#9B9B9B" stroke-width="1"/>
</svg>
